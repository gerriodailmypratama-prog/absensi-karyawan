name: Firestore Inventaris (migrasi Supabase)

# Langkah 0 migrasi: hitung isi Firebase. Baca-saja, output cuma angka (repo publik).
on:
  workflow_dispatch:

jobs:
  inventaris:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        working-directory: bot
        run: npm install
      - name: Inventaris
        working-directory: bot
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node inventaris.js
